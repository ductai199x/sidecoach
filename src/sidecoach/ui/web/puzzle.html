<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sidecoach · puzzle</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/puzzle.css" />
  </head>
  <body class="puzzle-page">
    <header id="bar">
      <div class="group">
        <span class="brand">sidecoach</span>
        <span id="pz-title" class="strong">puzzle</span>
        <span id="pz-msg" class="pz-msg">…</span>
      </div>
      <div class="group controls">
        <div class="ctlgroup" role="group" aria-label="Voice">
          <span class="ctllabel">voice</span>
          <button id="voice" class="iconbtn small" aria-pressed="true" title="The coach's answers aloud">
            <svg class="ic-on" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
            <svg class="ic-off" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12zM19 12a7 7 0 0 1-1.6 4.4l1.5 1.5A9 9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3L3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3a7 7 0 0 1-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2L21 19.7 4.3 3zM12 4L9.9 6.1 12 8.2V4z"/></svg>
          </button>
        </div>
        <div class="ctlgroup" role="group" aria-label="Puzzle">
          <span class="ctllabel">puzzle</span>
          <button id="giveup" class="ghost" title="Play the solution out">Give up</button>
          <button id="next" class="ghost" title="The next recommended puzzle" hidden>Next</button>
          <a id="lichess" class="ghost linkbtn" target="_blank" rel="noopener" title="This puzzle on Lichess">Lichess ↗</a>
          <button id="close" class="ghost" title="Close this puzzle">Close</button>
        </div>
      </div>
    </header>

    <main>
      <section id="left">
        <div class="board-wrap" id="boardwrap">
          <div id="board" class="board cb"></div>
          <div id="pieces" class="pieces"></div>
          <svg id="overlay" class="overlay" viewBox="0 0 8 8" aria-hidden="true"></svg>
          <div id="promo" class="promo" hidden></div>
        </div>
        <div class="gameinfo">
          <span id="side" class="strong">—</span>
          <span id="remaining"></span>
          <span id="level"></span>
        </div>
      </section>

      <section id="right">
        <div class="panel-title">Coach</div>
        <div id="coach" class="coach"></div>
        <div class="composer">
          <div class="box">
            <input id="askInput" type="text" placeholder="Ask the coach…" autocomplete="off" spellcheck="false" />
            <button id="send" class="sendbtn" data-state="idle" title="Send (Enter)">
              <svg class="ic ic-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 21 3l-8.5 18-2.5-7.5L3 11.5z"/></svg>
            </button>
          </div>
          <div class="chips-row">
            <button class="qchip" data-ask="hint" title="A nudge at the current disclosure level">Hint</button>
            <button class="qchip" data-ask="what should I play" title="The engine's move, then why">Best move</button>
            <button class="qchip" data-ask="show me the line" title="The engine's line">Line</button>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="health">
        <div class="stats">
          <span class="hitem"><span class="hk">tokens</span><span id="h-tokens" class="hv">–</span></span>
          <span class="hitem"><span class="hk">cost</span><span id="h-cost" class="hv">–</span></span>
          <span class="hitem"><span class="hk">misses</span><span id="h-misses" class="hv">0</span></span>
        </div>
        <button id="fold" class="ghost small">show log</button>
      </div>
      <div id="terminal" class="terminal" hidden></div>
    </footer>

    <script src="/puzzle.js"></script>
  </body>
</html>
