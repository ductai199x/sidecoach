<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sidecoach</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="bar">
      <span class="brand">sidecoach</span>
      <button id="startStop" class="primary">Start</button>
      <span id="status" class="status">idle</span>
      <span class="spacer"></span>
      <label class="ctl">voice
        <select id="voice"></select>
      </label>
      <label class="ctl"><input type="checkbox" id="mute" /> mute</label>
      <select id="end" class="end" title="End the game when the board cannot tell: a resignation, a flag, a draw">
        <option value="">End game…</option>
        <option value="resigned">I resigned / lost on time</option>
        <option value="won">Opponent resigned / flagged</option>
        <option value="draw">Draw agreed</option>
        <option value="forget">New game (forget this one)</option>
      </select>
      <button id="flip" class="ghost" title="Swap which side is at the bottom">Flip</button>
      <button id="analyze" class="ghost" title="Read the position now on the board (puzzle / mid-game)">Analyze</button>
    </header>

    <main>
      <section id="left">
        <div class="board-wrap">
          <div id="board" class="board"></div>
          <svg id="overlay" class="overlay" viewBox="0 0 8 8" aria-hidden="true"></svg>
        </div>
        <div id="gameinfo" class="gameinfo">
          <span id="side" class="strong">—</span>
          <span id="ply">ply 0</span>
          <span id="following">waiting for a start</span>
        </div>
      </section>

      <section id="right">
        <div class="panel-title">Moves</div>
        <div class="moves-wrap"><div id="moves"></div></div>
        <div class="panel-title">Coach</div>
        <div id="coach" class="coach"></div>
        <div class="composer">
          <div class="box">
            <input id="askInput" type="text" placeholder="Ask the coach…" autocomplete="off" spellcheck="false" />
            <button id="listenMode" class="iconbtn" data-mode="off" title="Listening: off. Click to cycle: hold to talk → voice → off">
              <svg class="ic ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-8.1 3.9l1.5-1.5A3 3 0 0 0 15 12h2zM5.3 3.9 20.1 18.7l-1.4 1.4-3.2-3.2A6.9 6.9 0 0 1 13 18.9V21h-2v-2.1A7 7 0 0 1 5 12h2a5 5 0 0 0 7.1 4.5l-1.5-1.5A3 3 0 0 1 9 12V9.4L3.9 5.3z"/></svg>
              <svg class="ic ic-ptt" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3h2a7 7 0 0 1-6 6.9V21h-2v-2.1A7 7 0 0 1 5 12h2a5 5 0 0 0 10 0z"/></svg>
              <svg class="ic ic-vad" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h2v4H3zm4-3h2v10H7zm4-4h2v18h-2zm4 4h2v10h-2zm4 3h2v4h-2z"/></svg>
            </button>
            <button id="send" class="sendbtn" data-state="idle" title="Send (Enter)">
              <svg class="ic ic-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l7 7-1.4 1.4L13 7.8V20h-2V7.8l-4.6 4.6L5 11z"/></svg>
              <svg class="ic ic-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3h2a7 7 0 0 1-6 6.9V21h-2v-2.1A7 7 0 0 1 5 12h2a5 5 0 0 0 10 0z"/></svg>
              <svg class="ic ic-wave" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h2v4H3zm4-3h2v10H7zm4-4h2v18h-2zm4 4h2v10h-2zm4 3h2v4h-2z"/></svg>
            </button>
          </div>
          <div class="chips-row">
            <button class="qchip" data-cmd="hint" title="A nudge at the current disclosure level">Hint</button>
            <button class="qchip" data-cmd="move" title="The engine's move, then why">Best move</button>
            <button class="qchip" data-cmd="line" title="The engine's line">Line</button>
            <span id="heard" class="heard" hidden></span>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div id="health" class="health">
        <span class="hk">fps</span><span id="h-fps" class="hv">–</span>
        <span class="hk">board</span><span id="h-lock" class="hv">–</span>
        <span class="hk">stage</span><span id="h-stage" class="hv">–</span>
        <span class="hk">pipeline</span><span id="h-pipe" class="hv">–</span>
        <span class="hk">lag</span><span id="h-lag" class="hv">–</span>
        <span class="hk">clock</span><span id="h-clock" class="hv">–</span>
        <span class="hk">coach queue</span><span id="h-coach" class="hv">–</span>
        <span class="hk">recording</span><span id="h-rec" class="hv">–</span>
        <span class="hk">voice</span><span id="h-voice" class="hv">–</span>
        <span class="hk">ear</span><span id="h-ear" class="hv">–</span>
        <span class="hk">rss</span><span id="h-rss" class="hv">–</span>
      </div>
      <div class="term-head">
        <div class="tabs">
          <button class="tab on" data-pane="terminal">debug terminal</button>
          <button class="tab" data-pane="conversation" title="What you and the coach said, and what the model was given each time">conversation</button>
        </div>
        <div id="chans" class="chips">
          <button class="chip on" data-chan="sys">sys</button>
          <button class="chip on" data-chan="vision">vision</button>
          <button class="chip on" data-chan="game">game</button>
          <button class="chip on" data-chan="engine">engine</button>
          <button class="chip on" data-chan="coach">coach</button>
          <button class="chip on" data-chan="voice">voice</button>
          <button class="chip on" data-chan="user">user</button>
        </div>
        <label class="ctl"><input type="checkbox" id="verbose" /> verbose</label>
        <input id="search" type="text" class="search" placeholder="filter…" />
        <span class="spacer"></span>
        <label class="ctl"><input type="checkbox" id="autoscroll" checked /> autoscroll</label>
        <button id="clearTerm" class="ghost small">clear</button>
      </div>
      <div id="terminal" class="terminal"></div>
      <div id="conversation" class="conversation" hidden></div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
