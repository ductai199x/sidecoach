<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sidecoach</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="bar">
      <div class="group">
        <span class="brand">sidecoach</span>
        <button id="startStop" class="primary">Start</button>
        <span id="status" class="status">idle</span>
      </div>
      <div class="group controls">
        <!-- The board as the coach reads it: which side is at the bottom, and a re-read. -->
        <div class="ctlgroup" role="group" aria-label="Board">
          <span class="ctllabel">board</span>
          <div class="seg" id="orient" title="Which side is at the bottom of the board the coach reads. For a game seen from its start this only turns the panel's board around; for a puzzle or a game joined mid-way it re-reads the screen the other way up.">
            <button id="orientWhite" class="segbtn" data-side="white" aria-pressed="false">&#9651; white</button>
            <button id="orientBlack" class="segbtn" data-side="black" aria-pressed="false">&#9651; black</button>
          </div>
          <button id="analyze" class="ghost" title="Read the position on the screen now (a puzzle, an analysis board, a game in progress). Done on its own when a board is up and no game is followed.">Re-read</button>
        </div>
        <!-- The game: what the board cannot tell, and forgetting it. -->
        <div class="ctlgroup menu" id="gameMenu">
          <span class="ctllabel">game</span>
          <button id="gameMenuBtn" class="ghost menubtn" aria-haspopup="menu" aria-expanded="false" title="End the game when the board cannot tell, or forget it">End&hellip; &#9662;</button>
          <div id="gameMenuList" class="menulist" role="menu" hidden>
            <button role="menuitem" data-outcome="resigned">I resigned / lost on time</button>
            <button role="menuitem" data-outcome="won">Opponent resigned / flagged</button>
            <button role="menuitem" data-outcome="draw">Draw agreed</button>
            <div class="menusep" role="separator"></div>
            <button role="menuitem" data-outcome="forget">Forget this game</button>
          </div>
        </div>
        <!-- The voice: on or off, and which. -->
        <div class="ctlgroup" role="group" aria-label="Voice">
          <span class="ctllabel">voice</span>
          <button id="mute" class="iconbtn small" aria-pressed="false" title="Mute the coach's voice">
            <svg class="ic-on" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
            <svg class="ic-off" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12zM19 12a7 7 0 0 1-1.6 4.4l1.5 1.5A9 9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3L3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3a7 7 0 0 1-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2L21 19.7 4.3 3zM12 4L9.9 6.1 12 8.2V4z"/></svg>
          </button>
          <select id="voice" title="The coach's voice"></select>
        </div>
      </div>
    </header>

    <main>
      <section id="left">
        <div class="board-wrap">
          <div id="board" class="board"></div>
          <svg id="overlay" class="overlay" viewBox="0 0 8 8" aria-hidden="true"></svg>
        </div>
        <div id="gameinfo" class="gameinfo">
          <span id="side" class="strong">—</span>
          <span id="ply">ply 0</span>
          <span id="following">waiting for a start</span>
        </div>
        </div>
      </section>

      <div id="splitBoard" class="vsplit" title="Drag to resize the board; double-click to reset"></div>

      <section id="right">
        <div class="panel-title">Moves</div>
        <div class="moves-wrap"><div id="moves"></div></div>
        <div id="splitMoves" class="hsplit" title="Drag to resize the move list; double-click to reset"></div>
        <div class="panel-title">Coach</div>
        <div id="coach" class="coach"></div>
        <div class="composer">
          <div class="box">
            <input id="askInput" type="text" placeholder="Ask the coach…" autocomplete="off" spellcheck="false" />
            <button id="listenMode" class="iconbtn" data-mode="off" title="Listening: off. Click to cycle: hold to talk → voice → off">
              <svg class="ic ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-8.1 3.9l1.5-1.5A3 3 0 0 0 15 12h2zM5.3 3.9 20.1 18.7l-1.4 1.4-3.2-3.2A6.9 6.9 0 0 1 13 18.9V21h-2v-2.1A7 7 0 0 1 5 12h2a5 5 0 0 0 7.1 4.5l-1.5-1.5A3 3 0 0 1 9 12V9.4L3.9 5.3z"/></svg>
              <svg class="ic ic-ptt" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3h2a7 7 0 0 1-6 6.9V21h-2v-2.1A7 7 0 0 1 5 12h2a5 5 0 0 0 10 0z"/></svg>
              <svg class="ic ic-vad" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h2v4H3zm4-3h2v10H7zm4-4h2v18h-2zm4 4h2v10h-2zm4 3h2v4h-2z"/></svg>
            </button>
            <button id="send" class="sendbtn" data-state="idle" title="Send (Enter)">
              <svg class="ic ic-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l7 7-1.4 1.4L13 7.8V20h-2V7.8l-4.6 4.6L5 11z"/></svg>
              <svg class="ic ic-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3h2a7 7 0 0 1-6 6.9V21h-2v-2.1A7 7 0 0 1 5 12h2a5 5 0 0 0 10 0z"/></svg>
              <svg class="ic ic-wave" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h2v4H3zm4-3h2v10H7zm4-4h2v18h-2zm4 4h2v10h-2zm4 3h2v4h-2z"/></svg>
            </button>
          </div>
          <div class="chips-row">
            <button class="qchip" data-cmd="hint" title="A nudge at the current disclosure level">Hint</button>
            <button class="qchip" data-cmd="move" title="The engine's move, then why">Best move</button>
            <button class="qchip" data-cmd="line" title="The engine's line">Line</button>
            <span id="heard" class="heard" hidden></span>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div id="splitTerm" class="tsplit" title="Drag to resize the terminal; double-click to reset"></div>
      <div id="health" class="health">
        <div class="stats">
        <span class="hitem"><span class="hk">fps</span><span id="h-fps" class="hv">–</span></span>
        <span class="hitem"><span class="hk">board</span><span id="h-lock" class="hv">–</span></span>
        <span class="hitem"><span class="hk">stage</span><span id="h-stage" class="hv">–</span></span>
        <span class="hitem"><span class="hk">pipeline</span><span id="h-pipe" class="hv">–</span></span>
        <span class="hitem"><span class="hk">lag</span><span id="h-lag" class="hv">–</span></span>
        <span class="hitem"><span class="hk">clock</span><span id="h-clock" class="hv">–</span></span>
        <span class="hitem"><span class="hk">coach queue</span><span id="h-coach" class="hv">–</span></span>
        <span class="hitem"><span class="hk">move→speech</span><span id="h-speech" class="hv" title="From a move being read to the first sound of the coach's word on it: the session's mean, and the last one">–</span></span>
        <span class="hitem"><span class="hk">first token</span><span id="h-token" class="hv" title="From the model call to its first token: the session's mean, and the last one">–</span></span>
        <span class="hitem"><span class="hk">tokens</span><span id="h-tokens" class="hv" title="The session's model calls: prompt tokens (cached share) · completion tokens">–</span></span>
        <span class="hitem"><span class="hk">cost</span><span id="h-cost" class="hv" title="At the prices in sidecoach.toml (llm.price_prompt_per_m, price_cached_per_m, price_completion_per_m)">–</span></span>
        <span class="hitem"><span class="hk">recording</span><span id="h-rec" class="hv">–</span></span>
        <span class="hitem"><span class="hk">voice</span><span id="h-voice" class="hv">–</span></span>
        <span class="hitem"><span class="hk">ear</span><span id="h-ear" class="hv">–</span></span>
        <span class="hitem"><span class="hk">rss</span><span id="h-rss" class="hv">–</span></span>
        </div>
        <button id="fold" class="ghost small" title="Hide the debug terminal">hide terminal</button>
      </div>
      <div class="term-head">
        <div class="tabs">
          <button class="tab on" data-pane="terminal">debug terminal</button>
          <button class="tab" data-pane="conversation" title="What you and the coach said, and what the model was given each time">conversation</button>
        </div>
        <div id="chans" class="chips">
          <button class="chip on" data-chan="sys">sys</button>
          <button class="chip on" data-chan="vision">vision</button>
          <button class="chip on" data-chan="game">game</button>
          <button class="chip on" data-chan="engine">engine</button>
          <button class="chip on" data-chan="coach">coach</button>
          <button class="chip on" data-chan="voice">voice</button>
          <button class="chip on" data-chan="user">user</button>
        </div>
        <label class="ctl"><input type="checkbox" id="verbose" /> verbose</label>
        <input id="search" type="text" class="search" placeholder="filter…" />
        <span class="spacer"></span>
        <label class="ctl"><input type="checkbox" id="autoscroll" checked /> autoscroll</label>
        <button id="clearTerm" class="ghost small">clear</button>
      </div>
      <div id="terminal" class="terminal"></div>
      <div id="conversation" class="conversation" hidden></div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
