[project]
name = "sidecoach"
version = "0.1.0"
description = "Vision-first chess coaching companion: watches the screen, finds the board, coaches Socratically."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "mss>=9.0",
    # Windows Graphics Capture: sees hardware-overlay windows that GDI (mss) shows frozen.
    "windows-capture>=2.0; sys_platform == 'win32'",
    "pydantic>=2.8",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
sidecoach = "sidecoach.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest-xdist>=3.6",
]
# The voice extras (TTS + STT + VAD) are heavy and optional: `uv sync --group voice`. Without
# them the coach runs silent and deaf -- the providers report the extras missing and no-op.
# Both models run on ONE runtime, onnxruntime-gpu, which also serves the CPU: the device is
# chosen per model in config (voice.tts_device / voice.stt_device = auto | cpu | cuda). The
# nvidia-* wheels carry the CUDA 13 / cuDNN 9 DLLs onnxruntime-gpu >= 1.27 loads through
# onnxruntime.preload_dlls(); on a machine with no NVIDIA GPU they are inert and the CPU
# provider is used.
voice = [
    "kokoro-onnx>=0.4",
    "onnx-asr[hub]>=0.12",
    "onnxruntime-gpu>=1.27",
    "nvidia-cudnn-cu13>=9.0",
    "nvidia-cublas>=13.0",
    "nvidia-cuda-runtime>=13.0",
    "nvidia-cuda-nvrtc>=13.0",
    "nvidia-cufft>=12.0",
    "nvidia-curand>=10.0",
    "sounddevice>=0.5",
    "pynput>=1.7",
]
# Whisper on the GPU as an alternative STT (faster-whisper / CTranslate2, CUDA 12 wheels).
whisper = [
    "faster-whisper>=1.2",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9.0,<10",
]
# The panel backend: a local FastAPI server behind the web UI, `uv sync --group panel`.
# The UI opens in the browser, so it is debuggable with real devtools and testable over HTTP.
panel = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=6.0",
]

[tool.uv]
# kokoro-onnx and onnx-asr depend on the CPU-only `onnxruntime`, which would shadow
# onnxruntime-gpu (same import name, last installed wins). Drop that requirement: the GPU
# build provides the CPU provider too, so one package serves both devices.
override-dependencies = [
    "onnxruntime ; sys_platform == 'never'",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
line-ending = "native"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is everything that needs no local data: the unit suite and the synthetic
# vision-pipeline suite, in parallel (about ten seconds). `-m slow` adds the recording
# replays, the server and Stockfish (a minute or two, serial: `-p no:xdist` or `-n 0`);
# `-m ""` is everything.
addopts = "-m 'not slow' -n auto -p no:cacheprovider"
markers = [
    "slow: replays a recording, starts the server or runs Stockfish; minutes, run deliberately",
    "vision: the synthetic vision-pipeline behaviour suite (in the default run)",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
