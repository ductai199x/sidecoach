[project]
name = "sidecoach"
version = "0.1.76"
description = "Vision-first chess coaching companion: watches the screen, finds the board, coaches Socratically."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "mss>=9.0",
    # Windows Graphics Capture: sees hardware-overlay windows that GDI (mss) shows frozen.
    "windows-capture>=2.0; sys_platform == 'win32'",
    "pydantic>=2.8",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    # The square classifier (vision/classifier.py) runs through onnxruntime on the CPU; the
    # GPU build is the one package that serves both devices (see the voice group below).
    "onnxruntime-gpu>=1.27",
]

[project.scripts]
sidecoach = "sidecoach.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest-xdist>=3.6",
]
# The voice extras (TTS + STT + VAD) are heavy and optional: `uv sync --group voice`. Without
# them the coach runs silent and deaf -- the providers report the extras missing and no-op.
# Both models run on ONE runtime, onnxruntime-gpu, which also serves the CPU: the device is
# chosen per model in config (voice.tts_device / voice.stt_device = auto | cpu | cuda). The
# nvidia-* wheels carry the CUDA 13 / cuDNN 9 DLLs onnxruntime-gpu >= 1.27 loads through
# onnxruntime.preload_dlls(); on a machine with no NVIDIA GPU they are inert and the CPU
# provider is used.
voice = [
    "kokoro-onnx>=0.4",
    "onnx-asr[hub]>=0.12",
    "onnxruntime-gpu>=1.27",
    "nvidia-cudnn-cu13>=9.0",
    "nvidia-cublas>=13.0",
    "nvidia-cuda-runtime>=13.0",
    "nvidia-cuda-nvrtc>=13.0",
    "nvidia-cufft>=12.0",
    "nvidia-curand>=10.0",
    "sounddevice>=0.5",
    "pynput>=1.7",
]
# The panel backend: a local FastAPI server behind the web UI, `uv sync --group panel`.
# The UI opens in the browser, so it is debuggable with real devtools and testable over HTTP.
panel = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=6.0",
    # The OS credential store for the API keys the settings window takes (config.secrets_*).
    "keyring>=25.0",
    # The Lichess puzzle file the first-run setup samples is zstd-compressed.
    "zstandard>=0.22",
]
# Exporting the embedding net (tools/classifier/export.py): Ultralytics for the pretrained
# YOLO26n-cls weights (CPU torch comes with it), onnx for the export; `uv sync --group
# classifier`. Nothing is trained; the runtime needs only the ONNX file under
# src/sidecoach/vision/models/.
classifier = [
    "onnx>=1.16",
    "ultralytics>=8.3",
]

[tool.uv]
# kokoro-onnx and onnx-asr depend on the CPU-only `onnxruntime`, which would shadow
# onnxruntime-gpu (same import name, last installed wins). Drop that requirement: the GPU
# build provides the CPU provider too, so one package serves both devices.
override-dependencies = [
    "onnxruntime ; sys_platform == 'never'",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The piece set's prompts, kept as they were sent (tools/pieces/README.md).
"tools/pieces/gen_round*.py" = ["E501"]
# The engine report's page, its text in the lines that build it.
"tools/engine/build_report.py" = ["E501"]

[tool.ruff.format]
line-ending = "native"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run needs no local data: unit tests, the synthetic vision-pipeline suite (on
# rendered boards and a few committed board crops), the panel and the server, on as many
# workers as keep the machine under 70% (tests/conftest.py), at below-normal priority, the
# longest tests first (tests/scheduling.py). `-m slow` adds what needs the optional voice
# models or the GPU; `-m ""` is everything.
addopts = "-m 'not slow' -n auto --dist loadgroup -p no:cacheprovider"
markers = [
    "slow: needs the optional voice models or the GPU; run deliberately",
    "vision: the synthetic vision-pipeline behaviour suite (in the default run)",
    "xdist_group: pytest-xdist's; tests of one group share a worker (see tests/conftest.py)",
]
# Starlette's own test client warning about itself (httpx, an anyio alias): nothing of ours to
# change; every warning that is ours stays loud.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
# The tests import the eval and puzzle tools as they run them: scripts, not packages, found on
# the path the tests put first (tests/test_eval_tools.py, test_story.py, ...).
extraPaths = ["tools/eval", "tools/puzzles"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
