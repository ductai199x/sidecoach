[package]
name = "sidecoach-desktop"
version = "0.1.7"
description = "Sidecoach: the chess coaching companion, as a desktop app"
authors = ["Tai Duc Nguyen"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The executable is `sidecoach` (sidecoach.exe on Windows): what a person types and what
# the installers and the .desktop entry name; the crate keeps its own name.
[[bin]]
name = "sidecoach"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sidecoach_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# The installer's build: whole-program optimisation, one codegen unit -- the smallest,
# fastest binary, about two minutes to compile.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The development build of the same binary (`npm run build:app:fast`): no LTO, many
# codegen units, incremental -- about half a minute. Functionally the same; a little
# larger and slower to start.
[profile.fast]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
strip = false
