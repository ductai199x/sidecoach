# The excellence rubric: what a reply of the coach is asked beyond being true and complete.
# tools/eval/rubric.py asks each criterion as one yes/no question about a reply against the
# record of its moment, for the classes in `applies_to` ("*" is every class). Edit freely:
# an edited question is asked again on the next run (answers are kept per question), an
# unchanged one is never paid for twice. (Removed 2026-09-25, Tai: "wasted words" -- conciseness is
# tuned by the prompt and the length check, not a judge's question.)
#
#   key         a short name, for the report
#   question    one yes/no question to the judge; {low} and {high} are the player's rating
#               band from the app's settings (about 1000 to 1400)
#   applies_to  the item classes it is asked for (tools/eval/taxonomy.py), or ["*"]
#   only_if     optional, decided in code; otherwise not asked and not scored:
#                 "ends_with_question" -- only when the reply ends with a question
#                 "has_links" -- only when the coach's request lists earlier moments of the
#                 same pattern ("# Earlier in this game")
#   code        optional: the criterion is decided in code by this rule (rubric.CODE_RULES),
#               never by the judge; the question then only says what the rule checks
#
# Made more checkable after round 3 (2026-09-25): a question the judge can answer from the
# reply alone, and nothing held against a reply for what its task did not ask.

[[criterion]]
key = "why"
question = "Does the reply name at least one specific piece, square or move of this position (or of the move just played) and say what it does, threatens or allows?"
applies_to = [
    "lesson", "verdict_weaker", "stuck_hint", "decisive_question", "ask_hint", "ask_plan",
    "ask_last_move", "ask_opponent_move", "ask_threat", "ask_named_move",
]
# A threat or the opponent's move: only when the request says what the move does.
only_if = "effect_given"

[[criterion]]
key = "transfer"
question = "Does the reply state a pattern or rule of thumb the player can use in other games?"
applies_to = [
    "lesson", "verdict_weaker", "stuck_hint", "decisive_question", "ask_hint", "ask_plan",
    "ask_last_move",
]

# The closing question, one fact at a time (Tai, 2026-09-18: one atomic fact a question).
[[criterion]]
key = "question_board"
question = "The reply ends with a question. Can the player answer that question by looking at the board?"
applies_to = [
    "lesson", "verdict_weaker", "stuck_hint", "decisive_question", "ask_hint", "ask_plan",
    "ask_last_move",
]
only_if = "ends_with_question"

# Not asked (the benchmark's gold set, 2026-09-25): whether the question leads to the lesson's
# idea, and whether the reply has not already answered it, reached only 80% agreement with the
# adjudicated labels, reworded twice -- the first is ambiguous ("what the lesson is about"),
# the second the judge cannot see when the answer is a move the reply names ("stopping
# Rxa3+" before "what check can they play?"). Tai's rule: what cannot be judged reliably is
# not asked. A code rule for the second is the way back in.
#
# [[criterion]]
# key = "question_idea"
# question = "The reply ends with a question. Is the answer to that question the move, piece or square the reply's lesson is about?"
#
# [[criterion]]
# key = "question_open"
# question = "The reply ends with a question. Does the player have to find its answer on the board, because the reply's own words do not give that answer?"

[[criterion]]
key = "connection"
question = "Does the reply name the move of at least one of the earlier moments of the same pattern its request listed? (Decided in code: rubric.names_a_link.)"
applies_to = ["lesson", "verdict_weaker", "ask_last_move", "ask_game_so_far"]
only_if = "has_links"
code = "names_a_link"

[[criterion]]
key = "actionable"
question = "Does the reply leave the player something concrete to look for or do next?"
applies_to = [
    "lesson", "verdict_weaker", "stuck_hint", "decisive_question", "ask_hint", "ask_plan",
    "ask_game_so_far",
]

# The tone, one fact at a time.
[[criterion]]
key = "no_gushing"
question = "Is the reply free of over-the-top praise -- superlatives piled up, 'amazing', 'incredible', 'genius'? One word of praise such as 'excellent' or 'great move' is fine."
applies_to = ["*"]

[[criterion]]
key = "no_scolding"
question = "Is the reply free of harsh words about the player -- insults, sarcasm, 'careless', 'terrible'? Naming a move's verdict (a mistake, a blunder, it cost you) is not harsh."
applies_to = ["*"]

[[criterion]]
key = "no_hedging"
question = "Is the reply free of hedging words -- maybe, perhaps, it might be -- about what it states?"
applies_to = ["*"]
