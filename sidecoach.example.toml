# Copy to sidecoach.toml (ignored by git) and edit. Every key is optional.

data_dir = "data"
tools_dir = "tools"

[capture]
fps = 10
record_frames = true
record_crops = true

[engine]
# stockfish_path = "tools/stockfish/stockfish-windows-x86-64-universal.exe"
multipv = 4
movetime_ms = 300
threads = 4
hash_mb = 256

[llm]
# A preset -- "local" (LM Studio on this machine), "dashscope" (Alibaba Cloud Model Studio,
# US), "openai" (what the coach was evaluated on: gpt-5.6-luna at medium effort) -- or any
# other name for a custom OpenAI-compatible endpoint, which then needs base_url and model.
# Unset fields use the preset's defaults from sidecoach.llm.factory. Keys come from .env
# (gitignored): OPENAI_API_KEY=..., DASHSCOPE_API_KEY=...
provider = "local"
# model = "gpt-5.6-luna"          # openai; dashscope: qwen3.8-max (default) or qwen3.8-flash
# reasoning_effort = "medium"     # openai (an "effort" provider): none, low, medium, high
# base_url = "http://localhost:1234/v1"
# api_key_env = "MY_KEY"          # a custom endpoint's key variable
# thinking_control = "prefill"    # prefill (LM Studio), param (DashScope), effort (OpenAI), none
# false suppresses reasoning; true lets the model reason before answering.
thinking = false
# Total output budget. Reasoning tokens count against it when thinking is on.
max_output_tokens = 1500
temperature = 0.7
timeout_s = 60.0

[coach]
stuck_seconds = 45
quiet = false
persona = "warm_direct"
inaccuracy = 0.05
mistake = 0.10
blunder = 0.20
decisive_gap = 0.10

[profile]
rating_low = 1000
rating_high = 1400
