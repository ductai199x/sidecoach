# Copy to sidecoach.toml (ignored by git) and edit. Every key is optional.

data_dir = "data"
tools_dir = "tools"

[capture]
fps = 10

[engine]
# stockfish_path = "tools/stockfish/stockfish-windows-x86-64-universal.exe"
multipv = 4
threads = 4
hash_mb = 256

[llm]
# A preset -- "local" (LM Studio on this machine), "dashscope" (Alibaba Cloud Model Studio,
# US), "openai" (what the coach was evaluated on: gpt-5.6-luna at medium effort) -- or any
# other name for a custom OpenAI-compatible endpoint, which then needs base_url and model.
# Or "none": no model at all -- the coach speaks from the board and its templates (the
# verdicts, the lesson on a mistake, the questions and hints, the review), free and
# offline. Unset fields use the preset's defaults from sidecoach.llm.factory. Keys come
# from .env (gitignored) or the app's credential store: OPENAI_API_KEY=..., DASHSCOPE_API_KEY=...
provider = "openai"                # gpt-5.6-luna at medium effort; "local" for LM Studio; "none"
# model = "gpt-5.6-luna"          # openai; dashscope: qwen3.8-max (default) or qwen3.8-flash
# reasoning_effort = "medium"     # openai (an "effort" provider): none, low, medium, high
# routine_effort = "none"         # the effort for a word on a fine move: "none" speaks in
                                  # under a second; "low" reasons as long as medium does
# The model's prices, USD per million tokens, for the session's cost in the panel's status
# strip (the tokens show regardless): fresh prompt, cached prompt, completion. The presets
# know gpt-5.6-luna's (0.20 / 0.02 / 1.20 on 2026-09-20); set them for any other model or
# when OpenAI moves them.
# price_prompt_per_m = 0.20
# price_cached_per_m = 0.02
# price_completion_per_m = 1.20
# base_url = "http://localhost:1234/v1"
# api_key_env = "MY_KEY"          # a custom endpoint's key variable
# thinking_control = "prefill"    # prefill (LM Studio), param (DashScope), effort (OpenAI), none
# The coach sets its own sampling and budgets per call (tuned in the evaluation); the
# reasoning knobs are thinking_control and the efforts above.
timeout_s = 60.0

[coach]
stuck_seconds = 45
quiet = false
persona = "warm_direct"
# verbalized_sampling = false      # true: several replies offered, one spoken (variety)
# local_verdicts = true            # best/excellent/book from the board; good/great/brilliant the model
inaccuracy = 0.05
mistake = 0.10
blunder = 0.20
decisive_gap = 0.10

[profile]
rating_low = 1000
rating_high = 1400
