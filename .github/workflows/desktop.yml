# The desktop app on Windows: the Python checks and tests, the Svelte build, the embedded
# interpreter, the Tauri bundle, the WebDriver smoke test, and on a tag the installer as a
# release asset with the updater's latest.json (docs/app-plan.md, section 6, step 10).
#
# Secrets the release job needs (Settings > Secrets):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  -- the updater's key
#   AZURE_* (tenant, client id, client secret, endpoint, account, profile) -- Azure Artifact
#   Signing, once the account exists; the step is skipped without them.
name: desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Python checks and tests
        run: |
          uv sync --group dev --group panel
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest -q -m "not slow and not vision"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Frontend
        working-directory: desktop
        run: |
          npm ci
          npm run check
          npm run build:web
      - name: The built frontend is the committed one
        run: git diff --exit-code --stat -- src/sidecoach/ui/web || (echo "run npm run build:web and commit" && exit 1)

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Embedded interpreter
        run: uv run python scripts/build_sidecar.py

      - name: Bundle
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/src-tauri/target/release -Filter sidecoach-desktop.exe | Select-Object -First 1
          $env:SIDECOACH_SIDECAR_ARGS = "--config sidecoach.example.toml"
          pwsh scripts/shell_cycles.ps1 -Exe $exe.FullName -Cycles 3

      - name: Sign the installer (Azure Artifact Signing)
        if: startsWith(github.ref, 'refs/tags/v') && env.AZURE_TENANT_ID != ''
        uses: azure/trusted-signing-action@v0
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: desktop/src-tauri/target/release/bundle/nsis
          files-folder-filter: exe

      - uses: actions/upload-artifact@v4
        with:
          name: sidecoach-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $exe = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $json = @{
            version = $ver
            notes = "Sidecoach $ver"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($exe.Name)" } }
          } | ConvertTo-Json -Depth 4
          Set-Content -Path latest.json -Value $json
          gh release create "${{ github.ref_name }}" $exe.FullName latest.json --title "Sidecoach $ver" --notes "Sidecoach $ver" --draft
        env:
          GH_TOKEN: ${{ github.token }}
