# The desktop app on Windows, in two jobs that run at once: the Python checks and the
# tests that need no GPU (the vision suite is the GPU's; it does not run here, Tai
# 2026-09-21), and the app -- the Svelte build, the embedded interpreter, the Tauri
# build, the smoke test, and on a tag the installer as a release asset with the
# updater's latest.json (docs/app.md).
#
# Secrets the release job needs (Settings > Secrets):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  -- the updater's key
# The installer is not Authenticode-signed (no signing account, by decision, 2026-09-21):
# a downloaded setup shows SmartScreen's "More info > Run anyway" on first run. The
# updater's own signature (minisign, the key above) is what verifies an update.
name: desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Checks
        run: |
          uv sync --group dev --group panel
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
      - name: "Tests (no GPU: the vision suite stays at home)"
        run: uv run pytest -q -m "not slow and not vision" --durations=10

  app:
    runs-on: windows-latest
    permissions:
      contents: write
    # At the job level so a step's `if` can read them (a secret is empty on a fork's PR).
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Frontend
        working-directory: desktop
        run: |
          npm ci
          npm run check
          npm run build:web
      - name: The built frontend is the committed one
        shell: pwsh
        run: |
          git diff --exit-code --stat -- src/sidecoach/ui/web
          if ($LASTEXITCODE -ne 0) { Write-Host 'the page changed: run npm run build:web in desktop/ and commit src/sidecoach/ui/web'; exit 1 }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true

      - name: Embedded interpreter
        run: uv run python scripts/build_sidecar.py

      # The updater's signature needs the private key, which a pull request from a fork
      # does not have: those builds stop at the exe (`--no-bundle`); pushes and tags bundle.
      - name: Build the app
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        working-directory: desktop
        run: npm run tauri build -- --no-bundle
      - name: Build the app and the installer
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        working-directory: desktop
        run: npm run tauri build

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/src-tauri/target/release -Filter sidecoach.exe | Select-Object -First 1
          # The interpreter the bundle would carry, named outright: without the bundle step
          # it is not copied next to the exe.
          $env:SIDECOACH_PYTHON = (Resolve-Path desktop/resources/python/python.exe).Path
          $env:SIDECOACH_DATA_DIR = (Resolve-Path data -ErrorAction SilentlyContinue).Path
          if (-not $env:SIDECOACH_DATA_DIR) { New-Item -ItemType Directory data | Out-Null; $env:SIDECOACH_DATA_DIR = (Resolve-Path data).Path }
          $env:SIDECOACH_SIDECAR_ARGS = "--config sidecoach.example.toml"
          pwsh scripts/shell_cycles.ps1 -Exe $exe.FullName -Cycles 3

      - uses: actions/upload-artifact@v4
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        with:
          name: sidecoach-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $exe = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $json = @{
            version = $ver
            notes = "Sidecoach $ver"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($exe.Name)" } }
          } | ConvertTo-Json -Depth 4
          Set-Content -Path latest.json -Value $json
          gh release create "${{ github.ref_name }}" $exe.FullName latest.json --title "Sidecoach $ver" --notes "Sidecoach $ver" --draft
        env:
          GH_TOKEN: ${{ github.token }}
